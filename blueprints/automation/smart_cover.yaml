blueprint:
  name: "Smart Cover Blueprint"
  description: |
    # 🪟 Smart Cover Blueprint
    Ein vereinfachtes Home Assistant Blueprint zur automatischen Rolladen-, Jalousie- und Markisensteuerung — basierend auf Uhrzeit, Sonnenstand, Helligkeit und Wetter.

    **Version**: 2026.8.17.3

    **Basierend auf**: [Cover Control Automation (CCA)](https://github.com/hvorragend/ha-blueprints) von hvorragend
    <sub>Lizenz: Open-Source. Basierend auf CCA von hvorragend.</sub>

  source_url: https://github.com/snoopatroopa/ha-smart-cover-blueprint/blob/main/blueprints/automation/smart_cover.yaml
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    blind:
      name: "🪟 Cover"
      description: >-
        Welcher Rolladen, welche Jalousie oder Markise soll gesteuert werden?

      selector:
        entity:
          filter:
            - domain:
                - cover

    cover_status_helper:
      name: "🔤 Cover Status Helper"
      description: >-
        Hilfsobjekt zum Speichern des letzten Status (JSON). Pro Automation wird ein eigener Helper benötigt.
        *Hinweis:* Manuell einen [input_text](https://my.home-assistant.io/redirect/helpers/) Helper mit einer <ins>Länge von 254 Zeichen</ins> anlegen.
      default: []
      selector:
        entity:
          domain: input_text

    feature_section:
      name: "Automatisierungsoptionen"
      icon: mdi:window-shutter-cog
      collapsed: true
      description: >-
        <center><p><small>
          Legt fest was das Blueprint steuert und wie es sich verhält. Die meisten Einstellungen haben sichere Standardwerte.
        </small></p></center>
      input:
        auto_options:
          name: "👉 Was soll gesteuert werden?"
          description: >-
            Wähle welche Aktionen das Blueprint steuern soll.

            *Nicht sicher? Die Standardauswahl (Morgenöffnung, Abendschließen, Zeitsteuerung) passt für die meisten Setups.*


            <details>
            <summary><code><strong>📖 HIER KLICKEN:</strong> Wie diese Optionen zusammenwirken</code></summary>


            **Grundsteuerung (Wann fahren):**

            Morgenöffnung und/oder Abendschließen aktivieren.


            **Feintuning (Wann auslösen):**

            Steuere ob Zeit, Helligkeit und Sonnenhöhe das Öffnen/Schließen beeinflussen.
            Lege die Bedingungslogik (UND/ODER) fest wenn beide aktiv sind.
            Schwellwerte und Sensoren in den jeweiligen Abschnitten unten konfigurieren.


            **Erweiterte Funktionen (Wie reagieren):**

            Lüftungsmodus und/oder Sonnenschutz für situatives Verhalten hinzufügen.


            **Sonnenhöhe vs. Sonnenschutz sind zwei verschiedene Dinge!**

            - **Sonnenhöhe** (☀️) = Öffnet/schließt basierend auf Sonnenaufgang/-untergang — Schwellwerte in *Sonnenhöhensteuerung* konfigurieren

            - **Sonnenschutz** (🥵) = Schließt die Abdeckung tagsüber teilweise wenn die Sonne direkt aufs Fenster scheint


            **Beispiel: Sommertag**

            - **6:00** — Sonnenhöhe löst Öffnung aus (Sonne über deinem Schwellwert)

            - **7:00** — Zeitbasiertes Öffnen wäre ausgelöst worden (Abdeckung ist bereits offen)

            - **12:00** — Sonnenschutz aktiviert (Sonne scheint direkt aufs Fenster → Teilschließen)

            - **18:00** — Sonnenschutz deaktiviert (Sonne weg → Abdeckung öffnet wieder)

            - **21:00** — Sonnenhöhe löst Schließen aus (Sonne unter deinem Schwellwert)


            **Hinweis zu Mehrfachauslösern**

            Mehrfaches Öffnen, Schließen, Beschatten etc. funktioniert nur wenn ein Trigger verfügbar ist.
            Numerische State-Trigger lösen nur unter bestimmten Umständen aus.


            </details>

          default:
            [
              auto_up_enabled,
              auto_down_enabled,
              time_control_enabled,
            ]
          selector:
            select:
              options:
                - label: "🔼 Morgenöffnung — Automatisch öffnen zur konfigurierten Zeit"
                  value: "auto_up_enabled"
                - label: "🔻 Abendschließen — Automatisch schließen zur konfigurierten Zeit"
                  value: "auto_down_enabled"
                - label: "⏲️ Zeitsteuerung — Zeitbasierte Trigger aktivieren"
                  value: "time_control_enabled"
                - label: "🔅 Helligkeitssteuerung — Früher öffnen/schließen bei Helligkeit"
                  value: "auto_brightness_enabled"
                - label: "☀️ Sonnenhöhensteuerung — Öffnen/schließen nach Sonnenstand"
                  value: "auto_sun_enabled"
                - label: "💨 Lüftungsmodus — Auf offene/gekippte Fenster reagieren, Aussperrschutz"
                  value: "auto_ventilate_enabled"
                - label: "🥵 Sonnenschutz / Beschattung — Teilweise schließen bei direkter Sonneneinstrahlung"
                  value: "auto_shading_enabled"
                - label: "🙈 Sichtschutz — Bei Anwesenheit + eingeschaltetem Licht auf Sichtschutzposition fahren"
                  value: "auto_privacy_enabled"
              multiple: true
              sort: false
              custom_value: false
              mode: list

        time_control:
          name: "⏲️ Art der Zeitsteuerung"
          description: >-
            Legt fest wie zeitbasiertes Öffnen und Schließen geplant wird. *(Nur relevant wenn **Zeitsteuerung** oben aktiviert ist.)*

            <details>
            <summary><code><strong>📖 HIER KLICKEN:</strong> Weitere Erklärungen</code></summary>
            <br />
            <ins>Zeitfelder für die Zeitsteuerung</ins><br /><br />
            Öffnungs- und Schließzeiten werden im Abschnitt Zeitsteuerung konfiguriert.
            Auch wenn du nur Helligkeit oder Sonnenhöhe nutzen möchtest, müssen Zeiten angegeben werden — sie definieren das Morgen- (hoch) und Abendfenster (runter).
            <br /><br />
            <ins>Calendar Control</ins><br />
            Zeitfelder in diesem Blueprint zur Steuerung verwenden.


            </details>

          default: time_control_input
          selector:
            select:
              options:
                - label: "✏️ Zeitfelder in diesem Blueprint verwenden"
                  value: "time_control_input"
              sort: false
              multiple: false
              custom_value: false

        brightness_sun_operator:
          name: "🔀 Verknüpfung: Helligkeit & Sonnenhöhe"
          description: >-
            Wie sollen Helligkeit und Sonnenhöhe verknüpft werden wenn **beide** aktiv sind?


            <details>
            <summary><code><strong>📖 HIER KLICKEN:</strong> ODER vs. UND – Was wählen?</code></summary>


            **⚡ ODER** *(Standard — für die meisten Nutzer empfohlen)*

            Die Abdeckung öffnet/schließt sobald **eine** der Bedingungen erfüllt ist.

            Beispiel: Öffnet wenn es hell genug *oder* die Sonne über dem Schwellwert ist.

            Reaktionsschneller — reagiert früher an klaren Morgen.


            **🔒 UND**

            Die Abdeckung öffnet/schließt nur wenn **beide** Bedingungen gleichzeitig erfüllt sind.

            Beispiel: Öffnet nur wenn es hell genug *und* die Sonne über dem Schwellwert ist.

            Konservativer — weniger Fehlauslösungen an bewölkten Morgen.


            *Hat keine Auswirkung wenn nur eine der beiden Bedingungen aktiviert ist.*

            </details>
          default: "or"
          selector:
            select:
              options:
                - label: "⚡ ODER — Eine der Bedingungen reicht (Standard)"
                  value: "or"
                - label: "🔒 UND — Beide Bedingungen müssen gleichzeitig erfüllt sein"
                  value: "and"
              mode: dropdown
              sort: false
              custom_value: false

        individual_config:
          name: "⚙️ Verhaltensoptionen"
          description: >-
            **Automatisierungsverhalten für deine Hardware und Präferenzen feinabstimmen.**


            <details>
            <summary><code><strong>📖 HIER KLICKEN:</strong> Was jede Kategorie steuert</code></summary>


            Passe das Verhalten der Automation an:

            - **Positionsverwaltung**: Steuere Bewegungen zwischen Zuständen (z.B. abends nicht hochfahren)

            - **Funktionssteuerung**: Automatische Übergänge deaktivieren (z.B. nach Beschattungsende beschattet bleiben)

            - **Tagesfrequenz**: Wiederholte Aktionen verhindern (z.B. nur einmal täglich öffnen)

            - **Hardware-Kompatibilität**: Gerätespezifische Eigenheiten umgehen



            **Hardware-spezifische Details**


            <ins>Warum eigene Aktionen statt Standard-Dienste?</ins><br />

            ition' are executed sequentially.


            **Lösungen:**

            - Shelly: Skript [cover_position_tilt.yaml] verwenden(https://gist.github.com/lukasvice/b364724d84c3ac4e160f7a7d8fa37066)

            - Homematic: Use custom service [homematicip_local.set_cover_combined_position](https://github.com/SukramJ/custom_homematic?tab=readme-ov-file#homematicip_localset_cover_combined_position)

            - Other devices: Implement via "Additional Actions" in the Service Calls section

            </details>


            </details>

          default: []
          selector:
            select:
              options:
                - label: "↕️ Beim Abendschließen nicht hochfahren"
                  value: "prevent_higher_position_closing"
                - label: "☀️ Beschattet bleiben: Nicht öffnen wenn Beschattung endet"
                  value: prevent_opening_after_shading_end
                - label: "🪟 Geschlossen bleiben: Nicht öffnen wenn Lüftung endet"
                  value: prevent_opening_after_ventilation_end
                - label: "⏱️ Nur einmal täglich öffnen"
                  value: "prevent_opening_multiple_times"
                - label: "⏱️ Nur einmal täglich schließen"
                  value: "prevent_closing_multiple_times"
                - label: "⏱️ Nur einmal täglich beschatten"
                  value: "prevent_shading_multiple_times"
              multiple: true
              sort: false
              custom_value: false
              mode: list

    position_section:
      name: "Positionseinstellungen"
      icon: mdi:window-shutter-settings
      description: >-
        <center><p><small>
          <strong>Wichtige Hinweise zu den Positionswerten</strong>
          <br />
          Bitte sicherstellen dass alle Positionswerte eindeutig sind und sich nicht überschneiden.
          <br />
          <strong>Positionslogik:</strong><br />
          - Rolladen/Jalousie: Öffnen (100%) > Beschattung (25%) > Schließen (0%)<br />
          - Markise: Öffnen (0%) < Beschattung (75%) < Schließen (100%)<br />
        </small></p></center>
      collapsed: true
      input:
        position_source:
          name: "📍 Positionsquelle"
          description: >-
            Wie liefert die Abdeckung ihre Positionsinformation?
            <details>
            <summary><code><strong>HIER KLICKEN: Wann welche Option?</strong></code></summary>

              - **Attribut current_position** (Standard): Die meisten Abdeckungen nutzen dies.
              - **Attribut position**: Wenn die Entity ein 'position'-Attribut hat aber kein 'current_position'. Im Entwickler-Tool → Zustände prüfen.
              - **Eigener Sensor**: Wenn die Abdeckung keine Position meldet / ein externer Sensor die Position verfolgt / manuelle Änderungen nicht erkannt werden

            </details>
          default: "current_position_attr"
          selector:
            select:
              options:
                - label: "Attribut current_position verwenden (Standard)"
                  value: "current_position_attr"
                - label: "Attribut position verwenden"
                  value: "position_attr"
                - label: "Eigenen Positionssensor verwenden"
                  value: "custom_sensor"
              mode: dropdown

        custom_position_sensor:
          name: "📍 Eigener Positionssensor"
          description: "Sensor der die Position liefert (0-100%). Nur bei 'Eigener Positionssensor' aktiv"
          default: []
          selector:
            entity:
              domain: sensor

        cover_type:
          name: "🎯 Abdeckungstyp"
          description: >-
            Wähle den Typ der Abdeckung die gesteuert werden soll.
            <br /><br />
            <strong>Rolladen/Jalousie:</strong> Position 0% = geschlossen (unten), 100% = offen (oben). Beschattung nutzt niedrigere Positionen.
            <br /><br />
            <strong>Markise:</strong> Position 0% = eingefahren (geschlossen), 100% = ausgefahren (offen). Beschattung nutzt höhere Positionen.
            <br /><br />
            ⚠️ <strong>Hinweis:</strong> Lüftung und Lamellensteuerung sind für Markisen nicht verfügbar.
            <br /><br />
            <details>
            <summary><code><strong>HIER KLICKEN:</strong> Positionswerte – Beispiele</code></summary>

            <strong>Für Rolladen/Jalousie:</strong><br />
            - Öffnungsposition: 100% (vollständig oben)<br />
            - Beschattungsposition: 25% (teilweise unten für Sonnenschutz)<br />
            - Lüftungsposition: 30% (leicht unten für Luftzufuhr)<br />
            - Schließposition: 0% (vollständig unten)<br />
            <br />
            <strong>Für Markisen:</strong><br />
            - Öffnungsposition: 0% (eingefahren/geschlossen)<br />
            - Beschattungsposition: 75% (ausgefahren für Sonnenschutz)<br />
            - Schließposition: 100% (vollständig ausgefahren)<br />
            <br />
            <em>Hinweis: Lüftungsposition wird für Markisen nicht verwendet.</em>

            </details>
          default: "rolladen"
          selector:
            select:
              options:
                - label: "🪟 Rolladen (ohne Lamellen)"
                  value: "rolladen"
                - label: "🎚️ Jalousie / Lamellen"
                  value: "jalousie"
                - label: "☂️ Markise (invertierte Positionslogik)"
                  value: "markise"
              mode: dropdown

        open_position:
          name: "🔼 Öffnungsposition"
          description: "Auf welche Position soll die Abdeckung beim Öffnen fahren?"
          default: 100
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: "%"

        close_position:
          name: "🔻 Schließposition"
          description: "Auf welche Position soll die Abdeckung beim Schließen fahren?"
          default: 0
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: "%"

        ventilate_position:
          name: "💨 Lüftungsposition"
          description: >-
            Auf welche Position soll die Abdeckung fahren wenn das Fenster gekippt ist?
            Wenn Schließen ausgelöst wird und der Kontaktsensor 'ein' ist, fährt die Abdeckung auf diese Position statt ganz zu schließen.
            <br /><br />Nicht 100 verwenden — in diesem Fall bitte 99. Beachte auch die Positionstoleranz.
          default: 30
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: "%"

        shading_position:
          name: "🥵 Beschattungsposition"
          description: "Auf welche Position soll die Abdeckung bei Beschattung fahren?"
          default: 25
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: "%"

        shading_position_alt:
          name: "🥵 Alternative Beschattungsposition"
          description: >-
            Optionale zweite Beschattungsposition. Ist die unten gewählte Gating-Entity 'ein',
            fährt die Abdeckung bei Beschattung auf diese Position statt auf die normale Beschattungsposition.
            <br /><br />Leer lassen um die alternative Beschattungsposition zu deaktivieren.
          default: []
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: "%"

        shading_position_alt_entity:
          name: "🥵 Trigger für alternative Beschattungsposition"
          description: >-
            Solange diese Entity 'ein' ist, beschattet die Abdeckung auf die alternative Beschattungsposition oben statt auf die normale.
            Ist sie 'aus' (oder nicht gesetzt), wird die normale Beschattungsposition verwendet.
            Ist die Abdeckung bereits am Beschatten wenn sich diese Entity ändert, wird sie auf die passende Position nachgefahren.
            <br /><br />Leer lassen um die alternative Beschattungsposition zu deaktivieren.
          default: []
          selector:
            entity:
              multiple: false
              domain:
                - binary_sensor
                - input_boolean

        position_tolerance:
          name: "〰️ Positionstoleranz"
          description: >-
            Toleranz für den Positionsvergleich.
            Dies sind absolute Werte, nicht relativ zu anderen Positionswerten.
          default: 0
          selector:
            number:
              min: 0.0
              max: 20.0
              unit_of_measurement: "%"

        drive_time:
          name: "⏲️ Fahrzeit"
          description: >-
            Wird zur Erkennung manueller Eingriffe verwendet. Etwas großzügig einstellen, nicht zu präzise.
            <br /><br />
            Innerhalb dieser Zeit wird angenommen, dass das Blueprint die letzte Aktion ausgeführt hat. Sonst würde es auf eigene Befehle reagieren und sie als manuellen Eingriff werten.
          default: 90
          selector:
            number:
              min: 0.0
              max: 180.0
              unit_of_measurement: seconds
              step: 1.0
              mode: slider

    tilt_position_section:
      name: "Lamelleneinstellungen"
      icon: mdi:image-filter-tilt-shift
      collapsed: true
      input:
        cover_tilt_wait_mode:
          name: "🔄 Lamellen-Wartemodus"
          description: >-
            Wähle aus wie gewartet werden soll bis die Lamellenbefehle gesendet werden:

            **Feste Verzögerung (Standard)**: Nutzt den konfigurierten Verzögerungswert. Funktioniert für die meisten Geräte.

            **Warten bis idle (Z-Wave)**: Wartet bis die Abdeckung 'offen' oder 'geschlossen'
            meldet bevor der Lamellenbefehl gesendet wird. Verhindert ignorierte Befehle auf
            Geräten die während der Fahrt keine Lamellenbefehle akzeptieren (z.B. Shelly Qubino Wave Shutter).

            Bei unzuverlässigen Lamellenpositionen: Modus auf 'Warten bis idle' wechseln.
          default: "fixed_delay"
          selector:
            select:
              options:
                - label: "⏱️ Feste Verzögerung (Standard)"
                  value: "fixed_delay"
                - label: "⏸️ Warten bis idle (Z-Wave Geräte)"
                  value: "wait_idle"
              mode: dropdown

        cover_tilt_wait_timeout:
          name: "🔄 Lamellen-Wartezeit"
          description: >-
            Maximale Wartezeit bis die Abdeckung im Ruhezustand ist bevor der Lamellenbefehl gesendet wird.
            Nur aktiv wenn 'Warten bis idle' gewählt ist.
          default: 30
          selector:
            number:
              min: 5
              max: 60
              unit_of_measurement: seconds
              step: 1
              mode: slider

        tilt_delay:
          name: "🕛 Standard Lamellenverzögerung"
          description: >-
            Verzögerung zwischen <em>set_cover_position</em> und <em>set_cover_tilt_position</em>.
            Nur bei Lamellensteuerung notwendig.
            Trennt die beiden Befehle zeitlich.
            <br /><br />**Optional**
          default: 0
          selector:
            number:
              min: 0.0
              max: 600.0
              unit_of_measurement: seconds
              step: 1.0
              mode: slider

        cover_tilt_config:
          name: "📐 Lamellensteuerung aktivieren"
          description: >-
            ⚠️ <strong>Hinweis:</strong> Lamellensteuerung ist nur für Jalousien verfügbar, nicht für Markisen.
            <br /><br />
            Wenn unterstützt, kann die Lamellenposition gesetzt werden. Das Attribut 'current_tilt_position' wird verwendet.
          default: cover_tilt_disabled
          selector:
            select:
              options:
                - label: "✅ Lamellensteuerung aktivieren"
                  value: "cover_tilt_enabled"
                - label: "❌ Lamellensteuerung deaktivieren"
                  value: "cover_tilt_disabled"
              multiple: false
              sort: false
              custom_value: false
              mode: list

        cover_tilt_reposition_config:
          name: "📐 Lamellen-Neuausrichtung"
          description: >-
            Wenn aktiviert kann gewählt werden ob die Jalousie vor dem Neigen auf eine neue Position zuerst geschlossen wird.
            In manchen Fällen kann schrittweises Neigen zu falschen Positionen führen, weil der Motor eine Mindestlaufzeit benötigt.
            Die Jalousie fährt zuerst auf 0 und dann auf die Zielposition.
          default: cover_tilt_reposition_disabled
          selector:
            select:
              options:
                - label: "✅ Lamellen-Neuausrichtung aktivieren"
                  value: "cover_tilt_reposition_enabled"
                - label: "❌ Lamellen-Neuausrichtung deaktivieren"
                  value: "cover_tilt_reposition_disabled"
              multiple: false
              sort: false
              custom_value: false
              mode: list

        open_tilt_position:
          name: "🔼 Lamellen Öffnungsposition"
          description: "Auf welche Lamellenposition beim Öffnen?"
          default: 50
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        close_tilt_position:
          name: "🔻 Lamellen Schließposition"
          description: "Auf welche Lamellenposition beim Schließen?"
          default: 50
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        ventilate_tilt_position:
          name: "💨 Lamellen Lüftungsposition"
          description: "Auf welche Lamellenposition beim Lüften?"
          default: 50
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        shading_tilt_position_0:
          name: "🥵 Lamellen Beschattungsposition"
          description: "Minimale Lamellenposition für die Beschattung. Die Lamellen fahren auf diese Position wenn die Sonnenhöhe unter Elevation 1 liegt."
          default: 0
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        shading_tilt_position_1:
          name: "🥵 Lamellen Beschattungsposition 1"
          description: "Lamellenposition bei Beschattung wenn Sonnenhöhe über Elevation 1"
          default: 20
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        shading_tilt_elevation_1:
          name: "🥵 Lamellen Sonnenhöhe 1"
          description: "Sonnenhöhe für Lamellenposition 1"
          default: 20
          selector:
            number:
              min: 0.0
              max: 90.0
              unit_of_measurement: °
              mode: slider
              step: 1.0
        shading_tilt_position_2:
          name: "🥵 Lamellen Beschattungsposition 2"
          description: "Lamellenposition bei Beschattung wenn Sonnenhöhe über Elevation 2"
          default: 37
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        shading_tilt_elevation_2:
          name: "🥵 Lamellen Sonnenhöhe 2"
          description: "Sonnenhöhe für Lamellenposition 2"
          default: 30
          selector:
            number:
              min: 0.0
              max: 90.0
              unit_of_measurement: °
              mode: slider
              step: 1.0
        shading_tilt_position_3:
          name: "🥵 Lamellen Beschattungsposition 3"
          description: "Lamellenposition bei Beschattung wenn Sonnenhöhe über Elevation 3"
          default: 50
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        shading_tilt_elevation_3:
          name: "🥵 Lamellen Sonnenhöhe 3"
          description: "Sonnenhöhe für Lamellenposition 3"
          default: 48
          selector:
            number:
              min: 0.0
              max: 90.0
              unit_of_measurement: °
              mode: slider
              step: 1.0

    time_section:
      name: "Zeitsteuerung"
      icon: mdi:clock-time-two-outline
      collapsed: true
      description: >-
        <center><p><small>
          Zeitfenster für Morgenöffnung und Abendschließen konfigurieren.<br />
          Zeitsteuerung kann in den <strong>Automatisierungsoptionen</strong> oben aktiviert werden.
          <a href="https://hvorragend.github.io/ha-blueprints/TIME_CONTROL_VISUALIZATION">Time Control Guide</a>
        </small></p></center>
      input:
        time_up_early:
          name: "🔼 Früheste Öffnungszeit – Werktage"
          description: >-
            Früheste Öffnungszeit. Die Abdeckung öffnet wenn <ins>NACH</ins> dieser Zeit der Helligkeits- oder Sonnenhöhenwert hoch genug ist.
            (**Hinweis**: Wenn ein Bewohner definiert ist, muss dieser auch wach sein.)
          default: "06:00:00"
          selector:
            time: {}

        time_up_early_non_workday:
